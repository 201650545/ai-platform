id: AI平台
name: AI 平台（ai-platform）
github: https://github.com/201650545/ai-platform
visibility: public
type: ai-infrastructure
home: Home.md
task_board: docs/01-任务看板.md

描述: >
  AI 基建主仓：多网关 API 聚合、AI 搜索、GitHub 管理、飞书集成、
  Agent 记忆协议、AI 资源运营。整合已完成（2026-09-03），
  来源仓映射见 docs/migration/path-map.md。

modules:
  - path: apps/central-platform/
    desc: 中央平台（原 00_中央平台）：认证/资源桥/GitHub 管理/飞书同步
  - path: apps/search-gateway/
    desc: AI 搜索网关（并入自 ai-hub）：核心服务 + MCP 封装 + Web 页面
  - path: apps/component-orchestrator/
    desc: 组件编排器（原 06_组件编排器）：图片组件/视频嵌入/画布/课时框架
  - path: resource-ops/
    desc: AI 自助资源运营体系
  - path: integrations/feishu/
    desc: 飞书多维表格导出（GitHub Pages 管线）
  - path: agent/memory/
    desc: 记忆协议文档（运行数据仍在原仓 ai-hub-memory）
  - path: jobs/modelscope-daily/
    desc: 模型每日同步定时任务

migration: docs/migration/path-map.md

规则: 本项目遵循 D:/通用规范（handbook）；差异写在本仓 README 与模块 README。
