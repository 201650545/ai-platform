# Credential Profiles
# Defines how each security domain authenticates to Feishu.
# Real secrets are NEVER stored here — they live in GitHub Secrets.

profiles:
  public-personal:
    description: "最小权限只读飞书应用，用于公开导出"
    # GitHub Secret names (program reads these at runtime)
    app_id_secret: FEISHU_PUBLIC_APP_ID
    app_secret_secret: FEISHU_PUBLIC_APP_SECRET
    # Fallback to legacy secrets for backward compatibility during migration
    fallback_app_id_secret: FEISHU_APP_ID
    fallback_app_secret_secret: FEISHU_APP_SECRET
    # Base registry: a JSON map of base_key -> app_token
    # Stored in GitHub Secret FEISHU_BASE_REGISTRY_JSON
    # Fallback: individual FEISHU_BASE_TOKEN secret (single-base mode)
    base_registry_secret: FEISHU_BASE_REGISTRY_JSON
    fallback_base_token_secret: FEISHU_BASE_TOKEN
    permissions:
      - bitable:app:readonly
      - bitable:app
