# Project: AI 自助资源库
# 公开范围：资源能力规格表 + 资源实例表（AI 调度所需能力/实例信息）
# 私密不导出：凭证池、账号资产汇总、自动化任务日志、工具资产明细表（含凭证/账号/环境变量名）
# 安全约定：凭证值（API key/token）永不落库、永不导出；请求体模板只含 {{MODEL}}/{{PROMPT}} 占位符

config_version: 1

project:
  slug: ai-resource
  title: "AI 自助资源库"
  description: "AI 资源能力规格与实例：能力表定义可调用能力与调用方式，实例表记录各平台额度/限速/状态。凭证、账号、任务日志私密不公开。"
  group: infrastructure
  tags:
    - AI资源
    - 能力规格
    - 资源实例
  enabled: true
  status: active

source:
  provider: feishu-bitable
  credential_profile: public-personal
  base_key: ai-resource
  export_view_name: "AI 公开导出"

table_discovery:
  mode: view-name
  include_tables: []
  exclude_tables: []
  require_export_view: true

export:
  chunk_size: 500
  include_schema: true
  include_summary: true
  include_record_id: true
  include_timestamps: true
  stable_sort: true

privacy:
  require_public_flag: false
  public_field_name: "是否公开"
  require_review_status: false
  review_field_name: "公开审核状态"
  approved_value: "已审核"
  scan_free_text: true
  scan_urls: true
  fail_on_sensitive_content: true

schedule:
  tier: daily

compatibility:
  mirror_to_legacy_root: false

tables:
  - table_name: "资源能力规格表"
    table_slug: capabilities
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "capability_id"
      - "资源名称"
      - "类别"
      - "逻辑模型"
      - "质量等级"
      - "调用方式"
      - "adapter_id"
      - "协议版本"
      - "认证方案"
      - "允许主机"
      - "模型族"
      - "endpoint"
      - "请求体模板"
      - "健康探测"
      - "路由组"
      - "免费额度描述"
      - "请求模板版本"
      - "状态"
      - "实例列表"

  - table_name: "资源实例表"
    table_slug: instances
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "instance_id"
      - "平台"
      - "实际模型名"
      - "额度总量"
      - "额度单位"
      - "剩余额度快照"
      - "重置规则"
      - "额度重置日"
      - "额度到期日"
      - "安全余量"
      - "限速"
      - "路由优先级"
      - "配置版本"
      - "获取方式备注"
      - "验证策略"
      - "上次验证"
      - "下次验证"
      - "状态"
      - "备注"
      - "所属能力"
