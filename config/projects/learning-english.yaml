# Project: Learning English
# Migrated from config/export.json (schema_version 2)
# This is the first project in the Data Hub.

config_version: 1

project:
  slug: learning-english
  title: "英语学习系统"
  description: "词汇、文本、计划、日志和能力状态"
  group: learning
  tags:
    - 英语
    - 学习
  enabled: true
  status: active

source:
  provider: feishu-bitable
  credential_profile: public-personal
  base_key: learning-english
  export_view_name: "AI 公开导出"

table_discovery:
  mode: view-name
  include_tables: []
  exclude_tables: []
  require_export_view: true

export:
  chunk_size: 500
  include_schema: true
  include_summary: true
  include_record_id: true
  stable_sort: true

privacy:
  require_public_flag: false
  public_field_name: "是否公开"
  require_review_status: false
  review_field_name: "公开审核状态"
  approved_value: "已审核"
  scan_free_text: true
  scan_urls: true
  fail_on_sensitive_content: true

schedule:
  tier: hourly

compatibility:
  # Mirror new data to legacy paths so existing consumers don't break.
  # Old: /data/manifest.json, /data/schema.json, /data/<table-slug>/*
  # New: /projects/learning-english/manifest.json, etc.
  mirror_to_legacy_root: true
  legacy_base_path: data

tables:
  - table_name: "文本库"
    table_slug: text-library
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "文本标题"
      - "英文原文"
      - "来源类型"
      - "来源详情"
      - "难度等级"
      - "适用词带"
      - "文本总词数"
      - "覆盖词数"
      - "词汇覆盖率"
      - "生词暴露数"
      - "使用状态"
      - "使用次数"
      - "上次使用日期"
      - "最早复用日期"
      - "中文参考译文"
      - "覆盖词汇列表"
      - "关联词汇"
      - "备注"

  - table_name: "轻量学习记录"
    table_slug: vocabulary
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "单词"
      - "词性"
      - "最简中文"
      - "核心用法"
      - "例句"
      - "我的造句"
      - "修改后句子"
      - "考研搭配"
      - "音标"
      - "词根词缀助记"
      - "派生词"
      - "学习次数"
      - "难度等级"
      - "词表来源"
      - "掌握状态"
      - "记忆阶段"
      - "正确次数"
      - "上次测验"
      - "下次复习"
      - "掌握维度"
      - "学习日志"
      - "关联文本"

  - table_name: "学习日志"
    table_slug: learning-log
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "日期"
      - "测验方向"
      - "测验维度"
      - "结果"
      - "正确答案"
      - "你的回答"
      - "测验类型"
      - "关联单词"
      - "检测方式"

  - table_name: "每日计划"
    table_slug: daily-plan
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "日期"
      - "复习词数"
      - "单词列表"
      - "完成状态"
      - "新词数"
      - "正确率"
      - "计划类型"
      - "单词列表(link)"

  - table_name: "词义与表达块"
    table_slug: lexical-units
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "展示名称"
      - "学习单位类型"
      - "词性"
      - "中文释义"
      - "英文释义"
      - "典型搭配"
      - "句型框架"
      - "使用语域"
      - "语用说明"
      - "易混表达"
      - "原始例句"
      - "我的例句"
      - "修改后例句"
      - "队列状态"
      - "重要性"
      - "是否公开"

  - table_name: "学习会话"
    table_slug: study-sessions
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "日期"
      - "开始时间"
      - "结束时间"
      - "会话类型"
      - "会话目标"
      - "输入分钟"
      - "输出分钟"
      - "形式学习分钟"
      - "流利度分钟"
      - "完成状态"
      - "主观难度"
      - "专注度"
      - "会话总结"
      - "是否公开"

  - table_name: "计划任务"
    table_slug: study-tasks
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "任务名称"
      - "任务类型"
      - "训练维度"
      - "计划顺序"
      - "预计时长分钟"
      - "实际时长分钟"
      - "计划日期"
      - "截止时间"
      - "状态"
      - "完成度"
      - "结果等级"
      - "是否延迟任务"
      - "是否迁移任务"
      - "是否公开"

  - table_name: "能力状态"
    table_slug: competency-state
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "能力维度"
      - "当前等级"
      - "最近测试时间"
      - "最近通过时间"
      - "下次复习时间"
      - "间隔天数"
      - "稳定度"
      - "难度"
      - "连续成功次数"
      - "连续失败次数"
      - "最近错误类型"
      - "新语境通过次数"
      - "自由产出通过次数"
      - "更新时间"
      - "是否公开"

  - table_name: "错误与改进"
    table_slug: error-remediation
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "错误类型"
      - "原始错误"
      - "正确形式"
      - "原因解释"
      - "改进策略"
      - "首次出现日期"
      - "最近出现日期"
      - "重复次数"
      - "是否已解决"
