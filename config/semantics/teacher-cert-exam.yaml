# Semantic configuration for the teacher-cert-exam project.
# Maps tables and fields to controlled semantic types for AI understanding.
# This file is human-maintained — do not auto-generate.

semantic_version: 1

project:
  slug: teacher-cert-exam
  domains:
    - exam
    - learning
  entity_types:
    - knowledge
    - content
    - metric
    - reference
    - learning_event
  capabilities:
    - study_planning
    - error_analysis
    - review_prioritization
    - progress_analysis
    - exam_analysis
    - learning_session_tracking
  supported_queries:
    - "制定教资学习计划"
    - "分析教资错题"
    - "查看考点掌握情况"
    - "分析真题题型分布"
    - "查看题型答题框架"
    - "查看学习作答记录"
    - "分析学习会话表现"

tables:
  knowledge-modules:
    role: knowledge
    entity_type: knowledge
    preferred_for:
      - review_prioritization
      - progress_analysis
    primary_display_field: "模块名称"
    date_field: null
    status_field: null

  exam-points:
    role: knowledge
    entity_type: knowledge
    preferred_for:
      - review_prioritization
      - progress_analysis
      - error_analysis
    primary_display_field: "考点名称"
    date_field: "下次复习日期"
    status_field: "掌握程度"

  question-templates:
    role: reference
    entity_type: reference
    preferred_for:
      - exam_analysis
      - method_guidance
    primary_display_field: "题型名称"
    date_field: null
    status_field: null

  error-notebook:
    role: error_log
    entity_type: learning_event
    preferred_for:
      - error_analysis
      - recent_activity
    primary_display_field: "错题标题"
    date_field: "错题日期"
    status_field: "是否已纠正"

  past-exam-questions:
    role: content
    entity_type: content
    preferred_for:
      - exam_analysis
      - error_analysis
    primary_display_field: "题目内容"
    date_field: null
    status_field: "难度"

  study-answers:
    role: learning_event
    entity_type: learning_event
    preferred_for:
      - progress_analysis
      - error_analysis
      - learning_session_tracking
    primary_display_field: "作答标题"
    date_field: "作答日期时间"
    status_field: "作答结果"

  study-sessions:
    role: learning_session
    entity_type: learning_event
    preferred_for:
      - progress_analysis
      - learning_session_tracking
    primary_display_field: "会话标题"
    date_field: "开始时间"
    status_field: "会话状态"

