# Semantic configuration for the civil-service-exam project.
# Maps tables and fields to controlled semantic types for AI understanding.
# This file is human-maintained — do not auto-generate.

semantic_version: 1

project:
  slug: civil-service-exam
  domains:
    - exam
    - learning
  entity_types:
    - task
    - knowledge
    - content
    - metric
    - reference
  capabilities:
    - study_planning
    - error_analysis
    - exam_analysis
    - review_prioritization
    - progress_analysis
  supported_queries:
    - "制定公考学习计划"
    - "分析公考错题"
    - "查看知识点掌握情况"
    - "分析真题命题规律"
    - "查看目标岗位信息"

tables:
  target-positions:
    role: reference
    entity_type: reference
    preferred_for:
      - goal_setting
    primary_display_field: "岗位名称"
    date_field: null
    status_field: null

  knowledge-points:
    role: knowledge
    entity_type: knowledge
    preferred_for:
      - review_prioritization
      - progress_analysis
    primary_display_field: "知识点"
    date_field: "下次复习"
    status_field: "掌握状态"

  daily-study-plan:
    role: plan
    entity_type: task_collection
    preferred_for:
      - daily_planning
    primary_display_field: "日期"
    date_field: "日期"
    status_field: "完成状态"

  practice-records:
    role: event_log
    entity_type: learning_event
    preferred_for:
      - error_analysis
      - recent_activity
    primary_display_field: "题目内容"
    date_field: "日期"
    status_field: "结果"

  past-exam-questions:
    role: content
    entity_type: content
    preferred_for:
      - exam_analysis
      - error_analysis
    primary_display_field: "题目内容"
    date_field: null
    status_field: "结果"

  experience-methods:
    role: reference
    entity_type: reference
    preferred_for:
      - content_recommendation
      - method_guidance
    primary_display_field: "经验标题"
    date_field: null
    status_field: "实用程度"

  exam-analysis:
    role: analysis
    entity_type: content
    preferred_for:
      - exam_analysis
      - method_guidance
    primary_display_field: "题目摘要"
    date_field: null
    status_field: "难度等级"

  common-traps:
    role: reference
    entity_type: reference
    preferred_for:
      - error_analysis
      - review_prioritization
    primary_display_field: "陷阱名称"
    date_field: null
    status_field: null

  exam-patterns:
    role: analysis
    entity_type: metric
    preferred_for:
      - exam_analysis
      - review_prioritization
    primary_display_field: "考点名称"
    date_field: null
    status_field: "考查频率"

fields:
  knowledge-points:
    "知识点":
      semantic_type: entity_identity_title
    "所属科目":
      semantic_type: knowledge_topic
    "子模块":
      semantic_type: knowledge_topic
    "掌握状态":
      semantic_type: mastery_level
    "记忆阶段":
      semantic_type: status
    "正确次数":
      semantic_type: attempt_count
    "学习次数":
      semantic_type: attempt_count
    "上次复习":
      semantic_type: event_date
    "下次复习":
      semantic_type: review_due_at
    "重要程度":
      semantic_type: task_priority
    "关联真题":
      semantic_type: relation
    "笔记":
      semantic_type: content_text

  practice-records:
    "日期":
      semantic_type: event_date
    "结果":
      semantic_type: outcome
    "题型":
      semantic_type: knowledge_topic
    "题源":
