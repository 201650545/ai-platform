# Validate — lightweight config + syntax validation for pull requests and pushes.
# Runs WITHOUT access to production secrets or GitHub Pages; only validates files.
name: "Validate"

on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "lib/**"
      - "integrations/feishu/.github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "lib/**"
      - "integrations/feishu/.github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: integrations/feishu

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/feishu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Validate configuration
        run: npm run validate:config

      - name: Validate semantic configs
        run: node scripts/validate-semantic.mjs

      - name: Validate AI documentation
        run: node scripts/validate-ai-docs.mjs
