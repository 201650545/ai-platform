# Daily Sync — syncs all daily-tier Feishu Bitable projects and deploys to GitHub Pages.
# Triggers: daily at 03:17 UTC and manual workflow_dispatch.
name: "Daily Sync"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project slug to sync (empty = all daily-tier projects)"
        required: false
        type: string
        default: ""
      force:
        description: "Force full re-sync, ignoring incremental cache"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run mode (no writes to public/, no deployment)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feishu-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Validate configuration
        run: npm run validate:config

      - name: Sync Feishu Base (daily tier)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_BASE_REGISTRY_JSON: ${{ secrets.FEISHU_BASE_REGISTRY_JSON }}
          # Inputs are passed through env to avoid shell injection.
          PROJECT_SLUG: ${{ github.event.inputs.project_slug }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$PROJECT_SLUG" ]; then
            ARGS="$ARGS --project $PROJECT_SLUG"
          else
            ARGS="$ARGS --tier daily"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/sync-hub.mjs $ARGS"
          node scripts/sync-hub.mjs $ARGS

      - name: Validate public output
        if: github.event.inputs.dry_run != 'true'
        run: npm run validate

      - name: Security scan
        if: github.event.inputs.dry_run != 'true'
        run: npm run security:scan

      - name: Configure Pages
        if: github.event.inputs.dry_run != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: public

  deploy:
    needs: build
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
