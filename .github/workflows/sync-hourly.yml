# Hourly Sync — syncs all hourly-tier Feishu Bitable projects and deploys to GitHub Pages.
# Triggers: every hour at :17 (UTC) and manual workflow_dispatch.
name: "Hourly Sync"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project slug to sync (empty = all hourly-tier projects)"
        required: false
        type: string
        default: ""
      force:
        description: "Force full re-sync, ignoring incremental cache"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run mode (no writes to public/, no deployment)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feishu-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      content_skip: ${{ steps.content_change.outputs.skip }}
      should_continue: ${{ steps.tier_check.outputs.should_continue }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Validate configuration
        run: npm run validate:config

      - name: 检测是否存在 hourly 层级项目（无则跳过本轮）
        id: tier_check
        run: |
          if [ -n "${{ github.event.inputs.project_slug }}" ]; then
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          elif grep -rqE "^[[:space:]]*tier:[[:space:]]*hourly[[:space:]]*$" config/projects/; then
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "当前没有任何 hourly 层级项目，本轮 Hourly Sync 跳过"
          fi

      - name: Sync Feishu Base (hourly tier)
        if: steps.tier_check.outputs.should_continue == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_BASE_REGISTRY_JSON: ${{ secrets.FEISHU_BASE_REGISTRY_JSON }}
          # Inputs are passed through env to avoid shell injection.
          PROJECT_SLUG: ${{ github.event.inputs.project_slug }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # P3-2 防噪音：上次部署的 content-hash URL（如 https://<user>.github.io/<repo>/content-hash）
          FDH_PREV_HASH_URL: ${{ secrets.FDH_PREV_HASH_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$PROJECT_SLUG" ]; then
            ARGS="$ARGS --project $PROJECT_SLUG"
          else
            ARGS="$ARGS --tier hourly"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/sync-hub.mjs $ARGS"
          node scripts/sync-hub.mjs $ARGS

      - name: 检测内容是否变化（P3-2 防噪音）
        id: content_change
        if: steps.tier_check.outputs.should_continue == 'true'
        run: |
          if [ -f public/.deploy-skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "内容无实质变化，跳过本次部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate public output
        if: steps.tier_check.outputs.should_continue == 'true' && github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        run: npm run validate
        env:
          FDH_NAME_BLACKLIST: ${{ secrets.FDH_NAME_BLACKLIST }}

      - name: Security scan
        if: steps.tier_check.outputs.should_continue == 'true' && github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        run: npm run security:scan
        env:
          FDH_NAME_BLACKLIST: ${{ secrets.FDH_NAME_BLACKLIST }}

      - name: Configure Pages
        if: steps.tier_check.outputs.should_continue == 'true' && github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        if: steps.tier_check.outputs.should_continue == 'true' && github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: public

  deploy:
    needs: build
    if: github.event.inputs.dry_run != 'true' && needs.build.outputs.should_continue == 'true' && needs.build.outputs.content_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
