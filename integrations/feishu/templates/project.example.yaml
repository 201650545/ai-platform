# Project: {{title}}
# Generated by add-project.mjs — edit before committing.

config_version: 1

project:
  slug: {{slug}}
  title: "{{title}}"
  description: "{{description}}"
  group: {{group}}
  tags: []
  enabled: true
  status: active

source:
  provider: feishu-bitable
  credential_profile: public-personal
  base_key: {{base_key}}
  export_view_name: "AI 公开导出"

table_discovery:
  mode: view-name
  include_tables: []
  exclude_tables: []
  require_export_view: true

export:
  chunk_size: 500
  include_schema: true
  include_summary: true
  include_record_id: true
  stable_sort: true

privacy:
  require_public_flag: false
  public_field_name: "是否公开"
  require_review_status: false
  review_field_name: "公开审核状态"
  approved_value: "已审核"
  scan_free_text: true
  scan_urls: true
  fail_on_sensitive_content: true

schedule:
  tier: {{schedule_tier}}

compatibility:
  mirror_to_legacy_root: false

# List tables explicitly, or leave empty for auto-discovery.
# Auto-discovery exports all tables that have the "AI 公开导出" view.
tables: []
# Example:
# tables:
#   - table_name: "表名"
#     table_slug: english-slug
#     view_name: "AI 公开导出"
#     enabled: true
#     fields:
#       - "字段1"
#       - "字段2"
