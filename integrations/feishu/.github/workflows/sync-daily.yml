# Daily Sync — syncs all daily-tier Feishu Bitable projects and deploys to GitHub Pages.
# Triggers: daily at 03:17 UTC and manual workflow_dispatch.
# ---------------------------------------------------------------------------
# 迁移说明（2026-09-03）：本文件随 feishu-data-hub 一并迁入 ai-platform，
# 现位于 integrations/feishu/.github/workflows/。GitHub 只识别仓库根目录的
# .github/workflows/，因此当前位置不会触发任何运行；集成阶段需迁移至根目录，
# 并使用下列 name（已加 "Feishu: " 前缀，避免与主仓其他业务线工作流重名）。
# working-directory / 路径过滤 / cache-dependency-path / artifact 路径均已
# 按新仓结构调整完毕，迁移到根目录后可直接运行。
# 详见 integrations/feishu/MIGRATION-NOTE.md
# ---------------------------------------------------------------------------
name: "Feishu: Daily Sync"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project slug to sync (empty = all daily-tier projects)"
        required: false
        type: string
        default: ""
      force:
        description: "Force full re-sync, ignoring incremental cache"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run mode (no writes to public/, no deployment)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feishu-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/feishu
    outputs:
      content_skip: ${{ steps.content_change.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/feishu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Validate configuration
        run: npm run validate:config

      - name: Sync Feishu Base (daily tier)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_BASE_REGISTRY_JSON: ${{ secrets.FEISHU_BASE_REGISTRY_JSON }}
          # Inputs are passed through env to avoid shell injection.
          PROJECT_SLUG: ${{ github.event.inputs.project_slug }}
          FORCE: ${{ github.event.inputs.force }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # P3-2 防噪音：上次部署的 content-hash URL（如 https://<user>.github.io/<repo>/content-hash）
          FDH_PREV_HASH_URL: ${{ secrets.FDH_PREV_HASH_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$PROJECT_SLUG" ]; then
            ARGS="$ARGS --project $PROJECT_SLUG"
          else
            ARGS="$ARGS --tier daily"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/sync-hub.mjs $ARGS"
          node scripts/sync-hub.mjs $ARGS

      - name: 检测内容是否变化（P3-2 防噪音）
        id: content_change
        run: |
          if [ -f public/.deploy-skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "内容无实质变化，跳过本次部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate public output
        if: github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        run: npm run validate
        env:
          FDH_NAME_BLACKLIST: ${{ secrets.FDH_NAME_BLACKLIST }}

      - name: Security scan
        if: github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        run: npm run security:scan
        env:
          FDH_NAME_BLACKLIST: ${{ secrets.FDH_NAME_BLACKLIST }}

      - name: Configure Pages
        if: github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        if: github.event.inputs.dry_run != 'true' && steps.content_change.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: integrations/feishu/public

  deploy:
    needs: build
    if: github.event.inputs.dry_run != 'true' && needs.build.outputs.content_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
