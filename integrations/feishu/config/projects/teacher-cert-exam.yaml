# Project: Teacher Certification Exam Preparation
# Third project in the Data Hub — teacher certification knowledge and exam point management.

config_version: 1

project:
  slug: teacher-cert-exam
  title: "教资备考系统"
  description: "知识模块、考点信息、题型模板、错题本、真题库、学习作答记录、学习会话"
  group: exam
  tags:
    - 教资
    - 备考
  enabled: true
  status: active

source:
  provider: feishu-bitable
  credential_profile: public-personal
  base_key: teacher-cert-exam
  export_view_name: "AI 公开导出"

table_discovery:
  mode: view-name
  include_tables: []
  exclude_tables: []
  require_export_view: true

export:
  chunk_size: 500
  include_schema: true
  include_summary: true
  include_record_id: true
  stable_sort: true

privacy:
  require_public_flag: false
  scan_free_text: true
  scan_urls: true
  fail_on_sensitive_content: true

schedule:
  tier: daily

compatibility:
  mirror_to_legacy_root: false

tables:
  - table_name: "知识模块表"
    table_slug: knowledge-modules
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "模块名称"
      - "模块说明"
      - "所属科目"
      - "知识树"
      - "关联考点"
      - "关联真题"

  - table_name: "考点信息表"
    table_slug: exam-points
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "考点名称"
      - "考点编号"
      - "知识内容"
      - "所属科目"
      - "所属模块"
      - "重要性"
      - "颜色标注"
      - "学习状态"
      - "掌握程度"
      - "能力等级"
      - "考察频率"
      - "验证方式"
      - "连续正确次数"
      - "总作答次数"
      - "总正确次数"
      - "上次复习日期"
      - "下次复习日期"
      - "最近检测日期"
      - "最近检测结果"
      - "最近错误模式"
      - "最近7天作答数"
      - "例词例句"
      - "知识树路径"
      - "关联真题"
      - "关联题型模板"
      - "创建时间"
      - "创建人"
      - "修改人"
      - "最后更新时间"

  - table_name: "题型模板表"
    table_slug: question-templates
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "题型名称"
      - "题目描述"
      - "所属科目"
      - "答题框架"
      - "典型例题"
      - "评分要点"
      - "关联模块"
      - "适用考题类型"
      - "建议限时分钟"
      - "默认满分值"
      - "撤除策略"
      - "L0无模板提示"
      - "L1仅题型名称"
      - "L2仅结构标题"
      - "L3关键词提示"
      - "L4简化模板"
      - "L5完整模板"

  - table_name: "错题本"
    table_slug: error-notebook
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "错题标题"
      - "题目内容"
      - "我的答案"
      - "正确答案"
      - "错因分析"
      - "错题日期"
      - "是否已纠正"
      - "所属科目"
      - "关联考点"
      - "错误模式分类"
      - "错误次数"
      - "错误原因分析"
      - "复测日期"
      - "复测结果"
      - "是否已订正"
      - "订正内容"
      - "关联作答记录"

  - table_name: "真题库"
    table_slug: past-exam-questions
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "题号"
      - "题目内容"
      - "选项"
      - "正确答案"
      - "答案解析"
      - "题型"
      - "难度"
      - "考次"
      - "分值"
      - "所属科目"
      - "关联考点"
      - "关联模块"

  - table_name: "学习作答记录"
    table_slug: study-answers
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "作答标题"
      - "作答ID"
      - "操作ID"
      - "作答日期时间"
      - "题目文本"
      - "题目来源"
      - "用户答案原文"
      - "修改后答案"
      - "参考答案"
      - "作答结果"
      - "训练类型"
      - "得分"
      - "总分"
      - "评分结果"
      - "反馈内容"
      - "用时秒数"
      - "是否限时"
      - "信心程度"
      - "是否使用模板"
      - "模板提示等级"
      - "是否使用其他提示"
      - "是否看过资料"
      - "是否需要复测"
      - "是否完成订正"
      - "下次复测日期"
      - "错误大类"
      - "错误细类"
      - "关联考点"
      - "关联知识模块"
      - "关联真题"
      - "关联题型模板"
      - "学习会话ID"

  - table_name: "学习会话"
    table_slug: study-sessions
    view_name: "AI 公开导出"
    enabled: true
    fields:
      - "会话标题"
      - "会话ID"
      - "ID"
      - "会话类型"
      - "会话状态"
      - "学科"
      - "开始时间"
      - "结束时间"
      - "总用时分钟"
      - "题目总数"
      - "正确数"
      - "基本正确数"
      - "部分正确数"
      - "错误数"
      - "超时数"
      - "放弃数"
      - "得分率"
      - "是否完成复盘"
      - "学习反思"
      - "Agent总结"
      - "下次学习建议"
      - "建议下次学习日期"
      - "关联考点"
      - "关联知识模块"
